<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <button id="change-theme">Change Theme</button>
    <div class="calculator">
      <div class="display"><input type="text" name="result" id="result" placeholder="0" readonly></div>
      <div class="calc-body">
        <div class="numbers-and-functions">
          <div class="clear-and-moldevision">
            <input type="button" value="C" id="clear">
            <input type="button" value="&longleftarrow;" id="backspace">
            <input type="button" value="%">
          </div>
          <div class="numbers">
            <input type="button" value="7">
            <input type="button" value="8">
            <input type="button" value="9">
            <input type="button" value="4">
            <input type="button" value="5">
            <input type="button" value="6">
            <input type="button" value="1">
            <input type="button" value="2">
            <input type="button" value="3">
            <input type="button" value="+/-" id="negate" disabled>
            <input type="button" value="0">
            <input type="button" value=".">
          </div>
        </div>
        <div class="operations">
          <input type="button" value="/">
          <input type="button" value="*">
          <input type="button" value="-">
          <input type="button" value="+">
          <input type="button" value="=" id="calculate">
        </div>
      </div>
    </div>
    <h4>This is a basic calculator, with lots of bugs!</h4>
  </div>
</body>

</html>
<script src="script.js"></script>
